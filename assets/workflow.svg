<g transform="translate(602 70)"><rect width="220" height="120" rx="14" fill="#1D283A" stroke="#475C79"/><text x="20" y="35" font-size="19" font-weight="700" fill="#F3F6FF">Build or audit</text><text x="20" y="64" font-size="15" fill="#C0CCE9">Reuse system tokens</text><text x="20" y="88" font-size="13" fill="#8FA5FF">Minimal change</text></g>
