<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 248" role="img" aria-labelledby="t d"><title id="t">Progressive knowledge loading</title><desc id="d">The small skill entry point routes to one relevant module, leading to implementation and focused verification.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101622"/><stop offset="1" stop-color="#161D30"/></linearGradient></defs>
