<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 370" role="img" aria-labelledby="title desc">
<title id="title">Interface Design Intelligence</title><desc id="desc">An illustrated system of three user interface panels and a focused guidance path, visualizing modular cross-platform design.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101621"/><stop offset="1" stop-color="#131726"/></linearGradient><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8FA5FF"/><stop offset="1" stop-color="#AC8BFF"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#222C40"/><stop offset="1" stop-color="#171E2E"/></linearGradient><pattern id="dot" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".10"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="30"/></filter></defs>
<rect width="1280" height="370" rx="26" fill="url(#bg)"/><rect width="1280" height="370" rx="26" fill="url(#dot)"/>
<circle cx="1010" cy="112" r="125" fill="#6c63ec" opacity=".12" filter="url(#glow)"/>
<!-- brand mark -->
<g transform="translate(64 58)"><rect width="47" height="47" rx="14" fill="url(#violet)"/><rect x="13" y="14" width="21" height="6" rx="3" fill="#101621"/><rect x="13" y="26" width="14" height="6" rx="3" fill="#101621"/><circle cx="33" cy="29" r="4" fill="#101621"/></g>
<text x="127" y="87" fill="#C9D3F1" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="3">IDI / AGENT SKILL</text>
<text x="64" y="170" fill="#F7F8FF" font-family="Arial, sans-serif" font-size="54" font-weight="750">Design with intent.</text>
<text x="64" y="236" fill="#F7F8FF" font-family="Arial, sans-serif" font-size="54" font-weight="750">Load only what you need<tspan fill="#A99BFF">.</tspan></text>
<text x="65" y="286" fill="#A5B2CD" font-family="Arial, sans-serif" font-size="21">A lean, cross-platform UI/UX skill for coding agents.</text>
<g transform="translate(64 320)" font-family="Arial,sans-serif" font-size="13" font-weight="600"><rect width="126" height="28" rx="14" fill="#262D41"/><text x="18" y="19" fill="#C6D5FF">Web + desktop</text><rect x="138" width="96" height="28" rx="14" fill="#262D41"/><text x="158" y="19" fill="#C6D5FF">Mobile</text><rect x="246" width="154" height="28" rx="14" fill="#262D41"/><text x="263" y="19" fill="#C6D5FF">Selective context</text></g>
<!-- right side: three original panels -->
