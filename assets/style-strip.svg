<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 228" role="img" aria-labelledby="t d">
<title id="t">Five visual directions</title><desc id="d">Original examples of glass, grain, chrome, pixel and editorial design directions.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#141a28"/><stop offset="1" stop-color="#10121a"/></linearGradient>
 <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#69e5f1"/><stop offset=".5" stop-color="#9e89f2"/><stop offset="1" stop-color="#fc899d"/></linearGradient>
 <linearGradient id="warm" x2="1" y2="1"><stop stop-color="#eac69b"/><stop offset=".5" stop-color="#de775c"/><stop offset="1" stop-color="#9c4836"/></linearGradient>
 <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f6f8ff"/><stop offset=".29" stop-color="#b1b7c4"/><stop offset=".46" stop-color="#4c5667"/><stop offset=".56" stop-color="#fafbff"/><stop offset=".74" stop-color="#7e8ba0"/><stop offset="1" stop-color="#e8edf5"/></linearGradient>
 <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".6" fill="#fff" opacity=".27"/><circle cx="5" cy="5" r=".7" fill="#291812" opacity=".16"/></pattern>
</defs>
<rect width="1200" height="228" rx="22" fill="url(#bg)"/>
<!-- evenly spaced showcase cards -->
<g font-family="Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1">
 <g transform="translate(18 18)"><rect width="220" height="192" rx="16" fill="#171e32" stroke="#354263"/><circle cx="48" cy="69" r="42" fill="#528fe9" opacity=".75"/><circle cx="112" cy="74" r="40" fill="#db65bb" opacity=".7"/><rect x="47" y="42" width="132" height="72" rx="26" fill="url(#glass)" opacity=".7" stroke="#cce7ff" stroke-opacity=".7"/><rect x="60" y="53" width="108" height="51" rx="20" fill="#fff" opacity=".2"/><text x="20" y="164" fill="#e9efff">LIQUID GLASS</text></g>
 <g transform="translate(254 18)"><rect width="220" height="192" rx="16" fill="url(#warm)"/><rect width="220" height="192" rx="16" fill="url(#grain)"/><text x="20" y="81" fill="#281714" font-family="Georgia,serif" font-size="34" font-weight="400" letter-spacing="-1">Warm,</text><text x="20" y="118" fill="#281714" font-family="Georgia,serif" font-size="31" font-style="italic" font-weight="400" letter-spacing="-1">tactile.</text><text x="20" y="164" fill="#301b18">ANALOG GRAIN</text></g>
 <g transform="translate(490 18)"><rect width="220" height="192" rx="16" fill="#080b12" stroke="#343b4b"/><text x="17" y="103" fill="url(#chrome)" font-family="Arial,sans-serif" font-size="57" font-weight="900" letter-spacing="-4">Aa</text><path d="M18 111h174" stroke="#4a5265" stroke-opacity=".8"/><text x="20" y="164" fill="#e2e7f1">CHROME TYPE</text></g>
 <g transform="translate(726 18)"><rect width="220" height="192" rx="16" fill="#f8fafc"/><text x="19" y="68" fill="#151823" font-family="Arial,sans-serif" font-size="32" font-weight="800" letter-spacing="-1">Clean.</text><g fill="#4d7eff"><rect x="132" y="58" width="17" height="17"/><rect x="149" y="75" width="17" height="17"/><rect x="115" y="75" width="17" height="17"/><rect x="132" y="92" width="17" height="17"/><rect x="166" y="92" width="17" height="17"/></g><text x="20" y="164" fill="#1c243a">PIXEL ACCENTS</text></g>
 <g transform="translate(962 18)"><rect width="220" height="192" rx="16" fill="#e9e5de"/><text x="20" y="83" fill="#211e1b" font-family="Georgia,serif" font-size="40" font-weight="400" letter-spacing="-2">The quiet</text><text x="20" y="121" fill="#211e1b" font-family="Georgia,serif" font-size="40" font-style="italic" font-weight="400">issue.</text><path d="M20 137h180" stroke="#837e76"/><text x="20" y="164" fill="#38312d">EDITORIAL SERIF</text></g>
</g>
