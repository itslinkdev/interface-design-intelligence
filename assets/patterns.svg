<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="t d"><title id="t">Three interface details</title><desc id="d">Original illustrations of a form validation state, selected control, and accessible status notice.</desc><rect width="1120" height="300" rx="22" fill="#F7F8FC"/>
<g font-family="Arial,sans-serif"><g transform="translate(32 32)"><rect width="325" height="237" rx="18" fill="white" stroke="#DCE2EA"/><text x="22" y="37" font-size="16" font-weight="700" fill="#20293B">Helpful validation</text><text x="22" y="73" font-size="13" fill="#536076">Password</text><rect x="22" y="84" width="281" height="42" rx="9" fill="#FFF8F8" stroke="#CF6769"/><text x="35" y="111" font-size="16" fill="#343945">••••••</text><text x="22" y="148" font-size="13" fill="#A4363A">Use at least 8 characters</text><rect x="22" y="168" width="281" height="46" rx="10" fill="#353BDA"/><text x="120" y="196" font-size="15" font-weight="700" fill="white">Continue</text></g>
<g transform="translate(398 32)"><rect width="325" height="237" rx="18" fill="white" stroke="#DCE2EA"/><text x="22" y="37" font-size="16" font-weight="700" fill="#20293B">Clear selection</text><rect x="22" y="70" width="281" height="55" rx="12" fill="#F0F2F9"/><rect x="27" y="75" width="136" height="45" rx="9" fill="#353BDA"/><text x="68" y="103" font-size="14" fill="white" font-weight="700">Monthly</text><text x="200" y="103" font-size="14" fill="#515D73">Yearly</text><text x="23" y="162" fill="#536076" font-size="14">Selection is visible beyond color.</text><text x="23" y="184" fill="#536076" font-size="14">Keyboard focus remains clear.</text></g>
<g transform="translate(764 32)"><rect width="325" height="237" rx="18" fill="white" stroke="#DCE2EA"/><text x="22" y="37" font-size="16" font-weight="700" fill="#20293B">Actionable feedback</text><rect x="22" y="69" width="281" height="77" rx="12" fill="#E7F6ED" stroke="#86BDA2"/><circle cx="46" cy="94" r="12" fill="#247B57"/><path d="m41 94 4 4 7-8" fill="none" stroke="white" stroke-width="2.5"/><text x="66" y="99" font-size="14" fill="#1D5038" font-weight="700">Changes saved</text><text x="40" y="126" font-size="13" fill="#39735A">Your preferences are up to date.</text><text x="22" y="183" fill="#536076" font-size="14">Status copy explains the result,</text><text x="22" y="204" fill="#536076" font-size="14">not just its color.</text></g></g></svg>